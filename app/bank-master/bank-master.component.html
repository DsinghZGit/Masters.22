<div class="main-content">
  <div class="container-fluid">

    <!-- Add Button -->
<div class="row mb-3">
      <div class="col-md-12 text-right">
        <button class="btn btn-secondary" (click)="showForm = true">Add</button>
      </div>
    </div>

    <!-- Bank Master Form -->
    <div class="row" *ngIf="showForm">
      <div class="col-md-12">
        <div class="card">
         <div class="card-header" style="background-color: #001f3f; color: white;">

            <h4 class="card-title">Bank Master</h4>
            <p class="card-category">Add or update bank details</p>
          </div>
          <div class="card-body">
      <form (ngSubmit)="AddBank()" #bankForm="ngForm">
  <div class="row">
    <div class="col-md-6">
      <div class="form-group">
        <label>Bank Name</label>
        <input type="text" class="form-control" [(ngModel)]="bank.name" name="name" required />
        <div class="text-danger" *ngIf="bankForm.submitted && !bank.name">Required</div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="form-group">
        <label>IFSC Code</label>
        <input type="text" class="form-control" [(ngModel)]="bank.ifsC_CODE" name="ifsC_CODE" required />
        <div class="text-danger" *ngIf="bankForm.submitted && !bank.ifsC_CODE">Required</div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-md-4">
      <div class="form-group">
        <label>Branch</label>
        <input type="text" class="form-control" [(ngModel)]="bank.branch" name="branch" />
      </div>
    </div>

    <div class="col-md-4">
      <div class="form-group">
        <label>Address</label>
        <input type="text" class="form-control" [(ngModel)]="bank.address" name="address" />
      </div>
    </div>

    <div class="col-md-4">
      <div class="form-group">
        <label>Contact Number</label>
        <input type="text" class="form-control" [(ngModel)]="bank.contacT_NUMBER" name="contactNumber" pattern="^\d{10}$" />
        <div class="text-danger" *ngIf="bankForm.submitted && bank.contacT_NUMBER?.length !== 10">
          Must be 10 digits
        </div>
      </div>
    </div>
  </div>

  <div class="form-check mb-3">
    <input type="checkbox" class="" [(ngModel)]="bank.isactive" name="isActive" id="isActive" />
    <label class="form-check-label" for="isActive">Is Active</label>
  </div>

  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-secondary">Submit</button>
    <button type="button" class="btn btn-danger" (click)="onCancel()">Cancel</button>
  </div>
</form>

          </div>
        </div>
      </div>
    </div>

    <!-- User List Table -->
    <div class="row mt-4" *ngIf="!showForm">
      <div class="col-md-12">
        <div class="card">
          <div class="card-header card-header-warning">
            <h4 class="card-title">User List</h4>
            <p class="card-category">Users in the system</p>
          </div>
          <div class="card-body">
            <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" style="width: 100%;">

              <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef>Bank Name</th>
                <td mat-cell *matCellDef="let user">{{ user.name }}</td>
              </ng-container>

              <ng-container matColumnDef="ifsC_CODE">
                <th mat-header-cell *matHeaderCellDef>IFSC Code</th>
                <td mat-cell *matCellDef="let user">{{ user.ifsC_CODE }}</td>
              </ng-container>

              <ng-container matColumnDef="branch">
                <th mat-header-cell *matHeaderCellDef>Branch</th>
                <td mat-cell *matCellDef="let user">{{ user.branch }}</td>
              </ng-container>

              <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            </table>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
