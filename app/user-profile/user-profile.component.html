<div class="main-content">
  <div class="container-fluid">
   <!-- Add Button -->
    <div class="row mb-2">
      <div class="col-md-12 text-right">
        <button class="btn btn-secondary" (click)="openAddUser()" >Add</button>
      </div>
    </div>

      <div class="row">
          <div class="col-md-12">
              <div class="card">
                  <div class="card-header card-header-danger">
                      <h4 class="card-title">User Management</h4>
                      <!-- <p class="card-category">Complete your profile</p> -->
                  </div>
                  <div class="card-body">
                <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

  <!-- Position Column -->
  <ng-container matColumnDef="fname">
    <th mat-header-cell *matHeaderCellDef> F_Name </th>
    <td mat-cell *matCellDef="let element"> {{element.fname}} </td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="lname">
    <th mat-header-cell *matHeaderCellDef> L_Name </th>
    <td mat-cell *matCellDef="let element"> {{element.lname}} </td>
  </ng-container>

  <!-- Weight Column -->
  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef> Email </th>
    <td mat-cell *matCellDef="let element"> {{element.email}} </td>
  </ng-container>

  

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

                  </div>
              </div>
          </div>
         
      
      
     
        </div>
  </div>
</div>
