<div class="main-content">
  <div class="container-fluid">

 
    <div class="row mb-3">
      <div class="col-md-12 text-right">
        <button class="btn btn-secondary" (click)="showForm = true">Add</button>
      </div>
    </div>

  
    <div class="row" *ngIf="showForm">
      <div class="col-md-12">
        <div class="card">
          <div class="card-header" style="background-color: #001f3f; color: white;">
            <h4 class="card-title">GST Master</h4>
            <p class="card-category">Add or update GST details</p>
          </div>
          <div class="card-body">
           
              <div class="row">
                <div class="col-md-6">
                  <div class="form-group">
                    <label>GST Rate</label>
                    <input type="number" class="form-control" [(ngModel)]="gstData.gstrate" name="gstrate" />
                   
                  </div>
                </div>

                <div class="col-md-6">
                  <div class="form-group">
                    <label>Description</label>
                    <input type="text" class="form-control" [(ngModel)]="gstData.description" name="description" />
                    
                  </div>
                </div>
              </div>

              <div class="form-check mb-3">
                <input type="checkbox" class="" [(ngModel)]="gstData.isactive" name="isActive" id="isActive" />
                <label class="form-check-label" for="isActive">Is Active</label>
              </div>

              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-secondary" (click)="AddGst()">Submit</button>
                <button type="button" class="btn btn-danger" (click)="onCancel()">Cancel</button>
              </div>
         
          </div>
        </div>
      </div>
    </div>

   
    <div class="row mt-4" *ngIf="!showForm">
      <div class="col-md-12">
        <div class="card">
          <div class="card-header card-header-warning">
            <h4 class="card-title">GST List</h4>
            <p class="card-category">GST entries in the system</p>
          </div>
          <div class="card-body">
            <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" style="width: 100%;">

              <ng-container matColumnDef="gstrate">
                <th mat-header-cell *matHeaderCellDef>GST Rate</th>
                <td mat-cell *matCellDef="let gst">{{ gst.gstrate }}</td>
              </ng-container>

              <ng-container matColumnDef="description">
                <th mat-header-cell *matHeaderCellDef>Description</th>
                <td mat-cell *matCellDef="let gst">{{ gst.description }}</td>
              </ng-container>

              <ng-container matColumnDef="isactive">
                <th mat-header-cell *matHeaderCellDef>Is Active</th>
                <td mat-cell *matCellDef="let gst">{{ gst.isactive ? 'Yes' : 'No' }}</td>
              </ng-container>

              <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            </table>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
